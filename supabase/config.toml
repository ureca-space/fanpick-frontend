
[functions.generate-match-report]
enabled = true
verify_jwt = false
import_map = "./functions/generate-match-report/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/generate-match-report/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/generate-match-report/*.html" ]

[functions.send-match-notifications]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-match-notifications/index.ts"
