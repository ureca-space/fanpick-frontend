name: Generate Match AI Reports

on:
  schedule:
    # 한국 시간 매일 09:40, 22:30, 23:30, 00:30, 01:30, 02:30
    # GitHub Actions cron은 UTC 기준
    - cron: "40 0 * * *"
    - cron: "30 13-17 * * *"

  # Actions 화면에서 직접 실행 가능
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-match-ai-reports
  cancel-in-progress: false

jobs:
  generate-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync KBO schedule
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
        run: node scripts/sync-kbo-schedule.mjs

      - name: Sync K League schedule
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
        run: node scripts/sync-kleague-schedule.mjs

      - name: Sync LCK schedule
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
        run: node scripts/sync-lck-schedule.mjs

      - name: Sync prediction results
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
        run: node scripts/sync-prediction-results.mjs

      - name: Generate match AI reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          REPORT_FUNCTION_SECRET: ${{ secrets.REPORT_FUNCTION_SECRET }}
        run: node scripts/generate-match-ai-reports.mjs
