name: Generate Match AI Reports

on:
  schedule:
    # 한국 시간 매일 09:40, 22:30, 23:30, 00:30, 01:30, 02:30
    # GitHub Actions cron은 UTC 기준
    - cron: "40 0 * * *"
    - cron: "30 13-17 * * *"

  # Actions 화면에서 직접 실행 가능
  workflow_dispatch:

jobs:
  generate-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate match AI reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          REPORT_FUNCTION_SECRET: ${{ secrets.REPORT_FUNCTION_SECRET }}
        run: node scripts/generate-match-ai-reports.mjs
