name: Sync KBO Schedule

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9,17 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: sync-kbo-schedule
  cancel-in-progress: false

jobs:
  sync-kbo:
    name: Sync KBO matches to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync KBO schedule
        run: node scripts/sync-kbo-schedule.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
