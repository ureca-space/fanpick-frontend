name: Sync K League Schedule

on:
  workflow_dispatch:

  schedule:
    - cron: "5 0 * * *"
    - cron: "3,13,23,33,43,53 4-14 * * *"

permissions:
  contents: read

concurrency:
  group: sync-kleague-schedule
  cancel-in-progress: false

jobs:
  sync-kleague:
    name: Sync K League matches to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync K League schedule
        run: node scripts/sync-kleague-schedule.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVER_KEY: ${{ secrets.SUPABASE_SERVER_KEY }}
